name: Ethio-Sports Rulebook Android CI/CD (APK & AAB)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  APP_NAME: "ኢትዮ-ስፖርት ደንብ"
  PACKAGE_NAME: "eth.culturalsports.manual"
  GITHUB_ORG: "EthioSport"
  GITHUB_REPO: "ethio-sports-manual"
  VERSION_CODE: "1"
  VERSION_NAME: "1.0.0"

jobs:
  build-apk-and-aab:
    name: Build Native Kotlin APK & Play Store AAB (SDK 36)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository (EthioSport/ethio-sports-manual)
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Android SDK (CompileSdk 36 & TargetSdk 36)
        uses: android-actions/setup-android@v3

      - name: 4. Configure Gradle 8.11.1 with Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 5. Decode Signing Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > app/release-keystore.jks
            echo "Release keystore decoded successfully to app/release-keystore.jks"
          else
            echo "KEYSTORE_BASE64 secret not set; generating fallback keystore for automated signing..."
            keytool -genkeypair -v \
              -keystore app/release-keystore.jks \
              -alias "${{ secrets.KEY_ALIAS || 'ethiosports' }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.STORE_PASSWORD || 'ethiosports1970' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'ethiosports1970' }}" \
              -dname "CN=Ethiopian Cultural Sports Federation, OU=Sports, O=ECSF, L=Addis Ababa, ST=Addis Ababa, C=ET"
          fi

      - name: 6. Build Signed Release APK, Debug APK, and Play Console AAB Bundle
        env:
          KEYSTORE_PATH: "release-keystore.jks"
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ethiosports' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ethiosports1970' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'ethiosports1970' }}
        run: |
          gradle assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: 7. Upload Signed Release APK (ለስልክ መጫኛ Release APK)
        uses: actions/upload-artifact@v4
        with:
          name: EthioSportsManual-v1.0.0-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 8. Upload Play Store Release AAB Bundle (ለGoogle Play Console AAB)
        uses: actions/upload-artifact@v4
        with:
          name: EthioSportsManual-v1.0.0-PlayStore-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: 9. Upload Debug APK (ለሙከራ Debug APK)
        uses: actions/upload-artifact@v4
        with:
          name: EthioSportsManual-v1.0.0-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
