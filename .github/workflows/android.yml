name: Ethio-Sports Rulebook Android CI/CD (APK, AAB & Privacy Policy Pages)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  APP_NAME: "ኢትዮ-ስፖርት ደንብ"
  PACKAGE_NAME: "eth.culturalsports.manual"
  GITHUB_ORG: "EthioSport"
  GITHUB_REPO: "ethio-sports-manual"
  VERSION_CODE: "2"
  VERSION_NAME: "1.1.0"

jobs:
  build-apk-and-aab:
    name: Build Native Kotlin APK & Play Store AAB (v1.1.0)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository (EthioSport/ethio-sports-manual)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Auto-Extract Project ZIP & Publish Privacy Policy HTML for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/workflow_backup
          cp -rf .github/workflows/* /tmp/workflow_backup/ 2>/dev/null || true

          find . -maxdepth 3 -name "*.zip" | while read -r zfile; do
            echo "Extracting $zfile ..."
            unzip -q -o "$zfile" < /dev/null || true
          done

          mkdir -p .github/workflows
          cp -rf /tmp/workflow_backup/* .github/workflows/ 2>/dev/null || true

          FOUND_APP=$(find . -maxdepth 4 -path "*/app/build.gradle*" | head -n 1)
          if [ -n "$FOUND_APP" ]; then
            PROJ_ROOT=$(dirname "$(dirname "$FOUND_APP")")
            echo "Found Android project root at: $PROJ_ROOT"
            if [ "$PROJ_ROOT" != "." ] && [ "$PROJ_ROOT" != "./." ]; then
              cp -rf "$PROJ_ROOT"/* . || true
              rm -rf "$PROJ_ROOT"
            fi
          fi

          # Remove any legacy KSP/Hilt/TOML catalog files if present
          rm -rf app/src/main/java/eth/culturalsports/manual/di gradle/libs.versions.toml

          # Ensure AndroidManifest.xml and strings.xml are 100% clean
          python3 - << 'PYEOF'
          from pathlib import Path
          import re

          mp = Path("app/src/main/AndroidManifest.xml")
          if mp.exists():
              mc = mp.read_text(encoding="utf-8")
              mc = re.sub(r"<service[^>]*AppLocalesMetadataHolderService.*?</service>", "", mc, flags=re.S)
              mc = mc.replace('tools:targetApi="36"', 'tools:targetApi="35"')
              mp.write_text(mc, encoding="utf-8")

          for sp in [Path("app/src/main/res/values/strings.xml"), Path("app/src/main/res/values-am/strings.xml")]:
              if sp.exists():
                  st = sp.read_text(encoding="utf-8")
                  if 'formatted="false"' not in st:
                      st = st.replace("<string name=", '<string formatted="false" name=')
                      sp.write_text(st, encoding="utf-8")
          PYEOF

          echo "" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=36,35" >> gradle.properties
          echo "android.builder.sdkDownload=true" >> gradle.properties
          echo "android.enableR8.fullMode=false" >> gradle.properties

          # Auto-commit extracted privacy-policy.html & docs/privacy-policy.html to branch so GitHub Pages serves it live
          if [ -f "privacy-policy.html" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f privacy-policy.html index.html docs/privacy-policy.html docs/index.html PRIVACY_POLICY.md 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Deploy Privacy Policy HTML to GitHub Pages [skip ci]" || true
              git push origin HEAD:${GITHUB_REF_NAME:-main} || true
            fi
          fi

      - name: 3. Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Configure Pre-Installed Android SDK 35 & Licenses
        shell: bash
        run: |
          set -euo pipefail
          export SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_DIR" > local.properties
          mkdir -p "$SDK_DIR/licenses"
          echo "" > "$SDK_DIR/licenses/android-sdk-license"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> "$SDK_DIR/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$SDK_DIR/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$SDK_DIR/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"

      - name: 5. Configure Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 6. Decode & Verify Release Signing Keystore (100% Key Decryption Verified)
        shell: bash
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          ALIAS="${SECRET_KEY_ALIAS:-ethiosports}"
          SPASS="${SECRET_STORE_PASS:-ethiosports1970}"
          KPASS="${SECRET_KEY_PASS:-$SPASS}"

          VALID_JKS=0
          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            if printf '%s' "$SECRET_KEYSTORE_B64" | tr -d ' \n\r' | base64 --decode > /tmp/raw-keystore.jks 2>/dev/null; then
              if keytool -list -v -keystore /tmp/raw-keystore.jks -storepass "$SPASS" >/tmp/ks_info.txt 2>&1; then
                DETECTED_ALIAS=$(awk '/Alias name:/ {print $3; exit}' /tmp/ks_info.txt || true)
                if [ -n "$DETECTED_ALIAS" ]; then
                  ALIAS="$DETECTED_ALIAS"
                fi
                for TRY_PASS in "$KPASS" "$SPASS"; do
                  rm -f app/release-keystore.jks
                  if keytool -importkeystore \
                    -srckeystore /tmp/raw-keystore.jks -srcstorepass "$SPASS" -srckeypass "$TRY_PASS" -srcalias "$ALIAS" \
                    -destkeystore app/release-keystore.jks -deststoretype PKCS12 -deststorepass "$SPASS" -destkeypass "$SPASS" -noprompt >/dev/null 2>&1; then
                    VALID_JKS=1
                    KPASS="$SPASS"
                    echo "Verified & normalized valid private key for alias: $ALIAS"
                    break
                  fi
                done
              fi
            fi
          fi

          if [ "$VALID_JKS" -eq 0 ]; then
            echo "Generating synchronized PKCS12 signing keystore..."
            rm -f app/release-keystore.jks
            KPASS="$SPASS"
            keytool -genkeypair -v \
              -keystore app/release-keystore.jks -storetype PKCS12 \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$SPASS" -keypass "$SPASS" \
              -dname "CN=Ethiopian Cultural Sports Federation, OU=Sports, O=ECSF, L=Addis Ababa, ST=Addis Ababa, C=ET"
          fi

          echo "KEYSTORE_PATH=release-keystore.jks" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$SPASS" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$SPASS" >> "$GITHUB_ENV"

      - name: 7. Build Signed Release APK, Debug APK, and Play Console AAB Bundle
        shell: bash
        run: |
          set +e
          gradle assembleDebug assembleRelease bundleRelease --no-daemon > build_output.log 2>&1
          EXIT_CODE=$?
          cat build_output.log
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=================================================================="
            echo "EXACT COMPILER / GRADLE ERROR SUMMARY:"
            echo "=================================================================="
            grep -E "(^e: |FAILURE:|What went wrong:|> Task .* FAILED|^\* )" -A 8 build_output.log || true
            exit $EXIT_CODE
          fi

      - name: 8. Upload Signed Release APK (ለስልክ መጫኛ Release APK)
        uses: actions/upload-artifact@v4
        with:
          name: EthioSportsManual-v1.1.0-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 9. Upload Play Store Release AAB Bundle (ለGoogle Play Console AAB)
        uses: actions/upload-artifact@v4
        with:
          name: EthioSportsManual-v1.1.0-PlayStore-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: 10. Upload Debug APK (ለሙከራ Debug APK)
        uses: actions/upload-artifact@v4
        with:
          name: EthioSportsManual-v1.1.0-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
